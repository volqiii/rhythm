name: Verify nineteen Rhythm commits

on:
  # 12:15 Yekaterinburg time on September 23 only.
  schedule:
    - cron: '15 7 23 9 *'

permissions:
  contents: write

jobs:
  verify-nineteen-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Run only for this one-time verification
        run: |
          if [ "$(TZ=Asia/Yekaterinburg date +%F)" != "2026-09-23" ]; then
            echo "The one-time verification date has passed."
            exit 0
          fi
      - uses: actions/checkout@v4
      - name: Create nineteen verification commits separately
        env:
          COMMIT_AUTHOR_NAME: ${{ secrets.COMMIT_AUTHOR_NAME }}
          COMMIT_AUTHOR_EMAIL: ${{ secrets.COMMIT_AUTHOR_EMAIL }}
        run: |
          if [ -z "$COMMIT_AUTHOR_NAME" ] || [ -z "$COMMIT_AUTHOR_EMAIL" ]; then
            echo "Commit author secrets are not configured."
            exit 1
          fi
          git config user.name "$COMMIT_AUTHOR_NAME"
          git config user.email "$COMMIT_AUTHOR_EMAIL"
          for NUMBER in $(seq 1 19); do
            printf '{"date":"2026-09-23","kind":"nineteen-commit-verification","number":%s}\n' "$NUMBER" >> public/data/nineteen-commit-verification.jsonl
            git add public/data/nineteen-commit-verification.jsonl
            git commit -m "test: verify nineteen Rhythm commits ($NUMBER/19)"
            git push origin HEAD:main
          done
