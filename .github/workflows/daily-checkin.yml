name: Rhythm check-in

on:
  schedule:
    # Monday-Friday, 00:05 in Yekaterinburg (UTC+5 = 19:05 UTC the day before).
    - cron: '5 19 * * 0-4'
    # Sunday at 00:05; the script keeps only every second ISO week.
    - cron: '5 19 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rhythm-check-in
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add a planned check-in
        run: node scripts/mark-today.mjs --scheduled
      - name: Save the journal
        env:
          COMMIT_AUTHOR_NAME: ${{ secrets.COMMIT_AUTHOR_NAME }}
          COMMIT_AUTHOR_EMAIL: ${{ secrets.COMMIT_AUTHOR_EMAIL }}
        run: |
          if [ -z "$COMMIT_AUTHOR_NAME" ] || [ -z "$COMMIT_AUTHOR_EMAIL" ]; then
            echo "Add COMMIT_AUTHOR_NAME and COMMIT_AUTHOR_EMAIL in repository secrets before running Rhythm."
            exit 1
          fi
          git config user.name "$COMMIT_AUTHOR_NAME"
          git config user.email "$COMMIT_AUTHOR_EMAIL"
          git add public/data/checkins.json
          if git diff --cached --quiet; then
            echo "No new check-in today."
            exit 0
          fi
          git commit -m "chore: rhythm check-in"
          git push

