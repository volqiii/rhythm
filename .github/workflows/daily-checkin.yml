name: Rhythm check-in

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rhythm-check-in
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check daily scheduled run
        id: daily_gate
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LOCAL_DATE="$(TZ=Asia/Yekaterinburg date +%F)"
          DONE_REF="refs/tags/rhythm-daily/$LOCAL_DATE"
          if git ls-remote --exit-code --refs origin "$DONE_REF" >/dev/null 2>&1; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Today's automatic check-ins are already complete."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save planned check-ins
        if: steps.daily_gate.outputs.run == 'true'
        env:
          COMMIT_AUTHOR_NAME: ${{ secrets.COMMIT_AUTHOR_NAME }}
          COMMIT_AUTHOR_EMAIL: ${{ secrets.COMMIT_AUTHOR_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$COMMIT_AUTHOR_NAME" ] || [ -z "$COMMIT_AUTHOR_EMAIL" ]; then
            echo "Add COMMIT_AUTHOR_NAME and COMMIT_AUTHOR_EMAIL in repository secrets before running Rhythm."
            exit 1
          fi
          LOCAL_DATE="$(TZ=Asia/Yekaterinburg date +%F)"
          GENERATED_REF="refs/tags/rhythm-generated/$LOCAL_DATE"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && git ls-remote --exit-code --refs origin "$GENERATED_REF" >/dev/null 2>&1; then
            echo "Today's GitHub check-ins are already published; continuing with GitVerse sync."
            exit 0
          fi
          LEVEL=$(node scripts/mark-today.mjs --print-level)
          if [ "$LEVEL" -eq 0 ]; then
            echo "Today is planned as an empty day."
            exit 0
          fi
          git config user.name "$COMMIT_AUTHOR_NAME"
          git config user.email "$COMMIT_AUTHOR_EMAIL"
          DID_COMMIT=false
          ADDED=0
          MARK_TODAY_ARGS=(--scheduled --force-existing)
          for NUMBER in $(seq 1 "$LEVEL"); do
            node scripts/mark-today.mjs "${MARK_TODAY_ARGS[@]}"
            git add public/data/checkins.json
            if git diff --cached --quiet; then
              continue
            fi
            CHECKIN_NUMBER=$(node -p "require('./public/data/checkins.json').entries.at(-1).number")
            git commit -m "chore: rhythm check-in ($CHECKIN_NUMBER/$LEVEL)"
            DID_COMMIT=true
            ADDED=$((ADDED + 1))
          done
          if [ "$DID_COMMIT" = true ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              git tag -a "rhythm-generated/$LOCAL_DATE" -m "Scheduled Rhythm check-ins $LOCAL_DATE"
              git push --atomic origin "HEAD:$GITHUB_REF" "$GENERATED_REF"
            else
              git push
            fi
            if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
              echo "Telegram is not connected. Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to enable notifications."
              exit 0
            fi
            CHECKIN_DATE=$(node -p "require('./public/data/checkins.json').entries.at(-1).date")
            MESSAGE=$(printf '✅ Rhythm: %s\nДобавлено коммитов: %s' "$CHECKIN_DATE" "$ADDED")
            curl --fail --silent --show-error --retry 3 --retry-delay 3 --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" || echo "::warning::Telegram notification failed; continuing with GitVerse sync."
          else
            echo "The planned level is already complete."
          fi

      - name: Sync check-ins to GitVerse
        if: steps.daily_gate.outputs.run == 'true'
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          COMMIT_AUTHOR_NAME: ${{ secrets.COMMIT_AUTHOR_NAME }}
          COMMIT_AUTHOR_EMAIL: ${{ secrets.COMMIT_AUTHOR_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "::error::Add GITVERSE_TOKEN to repository Actions secrets."
            exit 1
          fi

          SOURCE_DIR="$GITHUB_WORKSPACE"
          VERSE_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERSE_DIR"' EXIT
          VERSE_URL="https://${GITVERSE_TOKEN}@gitverse.ru/volqi/rhythm.git"
          git clone --quiet --branch master --single-branch "$VERSE_URL" "$VERSE_DIR"

          VERSE_FILE="$VERSE_DIR/public/data/checkins.json"
          if [ ! -f "$VERSE_FILE" ]; then
            echo "::error::GitVerse branch master does not contain public/data/checkins.json."
            exit 1
          fi

          read_last_state() {
            node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const e=Array.isArray(d.entries) ? d.entries.at(-1) : undefined; process.stdout.write(e ? `${e.date}|${e.number}` : "")' "$1"
          }
          read_commit_state() {
            git -C "$SOURCE_DIR" show "$1:public/data/checkins.json" |
              node -e 'let s=""; process.stdin.on("data",x=>s+=x).on("end",()=>{const d=JSON.parse(s); const e=Array.isArray(d.entries) ? d.entries.at(-1) : undefined; process.stdout.write(e ? `${e.date}|${e.number}` : "")})'
          }

          VERSE_STATE="$(read_last_state "$VERSE_FILE")"
          MATCH_SHA=""
          while IFS= read -r SHA; do
            STATE="$(read_commit_state "$SHA")"
            if [ "$STATE" = "$VERSE_STATE" ]; then
              MATCH_SHA="$SHA"
            fi
          done < <(git -C "$SOURCE_DIR" log --format='%H' --reverse HEAD -- public/data/checkins.json)

          if [ -z "$MATCH_SHA" ]; then
            echo "::error::Could not match GitVerse's latest check-in with GitHub history; leaving GitVerse unchanged."
            exit 1
          fi

          git -C "$VERSE_DIR" config user.name "$COMMIT_AUTHOR_NAME"
          git -C "$VERSE_DIR" config user.email "$COMMIT_AUTHOR_EMAIL"
          SYNCED=0
          while IFS= read -r SHA; do
            STATE="$(read_commit_state "$SHA")"
            if [ "$STATE" = "$VERSE_STATE" ]; then
              continue
            fi
            git -C "$SOURCE_DIR" show "$SHA:public/data/checkins.json" > "$VERSE_FILE"
            git -C "$VERSE_DIR" add public/data/checkins.json
            if git -C "$VERSE_DIR" diff --cached --quiet; then
              VERSE_STATE="$STATE"
              continue
            fi
            MESSAGE="$(git -C "$SOURCE_DIR" show -s --format=%s "$SHA")"
            COMMIT_DATE="$(git -C "$SOURCE_DIR" show -s --format=%aI "$SHA")"
            GIT_AUTHOR_DATE="$COMMIT_DATE" GIT_COMMITTER_DATE="$COMMIT_DATE" \
              git -C "$VERSE_DIR" commit -m "$MESSAGE"
            git -C "$VERSE_DIR" push origin HEAD:master
            VERSE_STATE="$STATE"
            SYNCED=$((SYNCED + 1))
          done < <(git -C "$SOURCE_DIR" rev-list --reverse "$MATCH_SHA..HEAD" -- public/data/checkins.json)

          if [ "$SYNCED" -gt 0 ]; then
            echo "Synced $SYNCED check-in commits to GitVerse master individually."
          else
            echo "GitVerse is already up to date."
          fi
      - name: Mark daily scheduled run complete
        if: github.event_name == 'schedule' && steps.daily_gate.outputs.run == 'true'
        shell: bash
        run: |
          LOCAL_DATE="$(TZ=Asia/Yekaterinburg date +%F)"
          DONE_REF="refs/tags/rhythm-daily/$LOCAL_DATE"
          git tag -a "rhythm-daily/$LOCAL_DATE" -m "Rhythm check-ins synced to GitVerse on $LOCAL_DATE"
          git push origin "$DONE_REF"
