name: Verify twenty Rhythm commits

on:
  # 11:10 Yekaterinburg time on September 23 only.
  schedule:
    - cron: '10 6 23 9 *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-twenty-commits.yml'

permissions:
  contents: write

jobs:
  verify-twenty-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Run only for this one-time verification
        run: |
          if [ "$(TZ=Asia/Yekaterinburg date +%F)" != "2026-09-23" ]; then
            echo "The one-time verification date has passed."
            exit 0
          fi
      - uses: actions/checkout@v4
      - name: Create twenty verification commits
        env:
          COMMIT_AUTHOR_NAME: ${{ secrets.COMMIT_AUTHOR_NAME }}
          COMMIT_AUTHOR_EMAIL: ${{ secrets.COMMIT_AUTHOR_EMAIL }}
        run: |
          if [ -z "$COMMIT_AUTHOR_NAME" ] || [ -z "$COMMIT_AUTHOR_EMAIL" ]; then
            echo "Commit author secrets are not configured."
            exit 1
          fi
          git config user.name "$COMMIT_AUTHOR_NAME"
          git config user.email "$COMMIT_AUTHOR_EMAIL"
          for NUMBER in $(seq 1 20); do
            printf '{"date":"2026-09-23","kind":"twenty-commit-verification","number":%s}
' "$NUMBER" >> public/data/twenty-commit-verification.jsonl
            git add public/data/twenty-commit-verification.jsonl
            git commit -m "test: verify twenty Rhythm commits ($NUMBER/20)"
          done
          git push
